spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mnext
    username: mnext
    password: mnext
  rabbitmq:
    host: localhost
    listener:
      simple:
        missing-queues-fatal: false
    port: 5672
    username: mnext
    password: mnext

mnext:
  readmodel:
    enabled: true
    # 队列名用监听器默认值 readmodel.events(RabbitOutboxPublisher 会把每个事件投一份到此共享队列);
    # 不再写死到单个工作空间队列,否则只有该工作空间的读模型会被更新。
