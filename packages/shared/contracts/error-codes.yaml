version: 1
codes:
  - code: KERNEL-400-SCHEMA-INVALID
    httpStatus: 400
    title: 载荷不符合命令 Schema
    responseRequirement: 列出违例 JSON Pointer
  - code: KERNEL-400-NESTED-BATCH
    httpStatus: 400
    title: BatchCommand 嵌套
    responseRequirement: —
  - code: KERNEL-404-WORKSPACE-NOT-FOUND
    httpStatus: 404
    title: 空间不存在或不可见
    responseRequirement: 不泄露越权目标存在性
  - code: KERNEL-404-TARGET-NOT-FOUND
    httpStatus: 404
    title: 目标不存在或不可见
    responseRequirement: 不泄露越权目标存在性
  - code: KERNEL-404-TYPE-NOT-FOUND
    httpStatus: 404
    title: 类型不存在或不可见
    responseRequirement: 不泄露越权目标存在性
  - code: KERNEL-409-VERSION-CONFLICT
    httpStatus: 409
    title: 乐观版本冲突
    responseRequirement: 冲突对象、当前版本、冲突字段、建议操作(§5.3)
  - code: KERNEL-409-IDEMPOTENCY-CONFLICT
    httpStatus: 409
    title: 同幂等键不同载荷
    responseRequirement: 返回原 commandId
  - code: KERNEL-409-DUPLICATE-RELATION
    httpStatus: 409
    title: 同型同向同端点活动关系已存在
    responseRequirement: 返回已存在 relationId
  - code: KERNEL-409-CYCLE-DETECTED
    httpStatus: 409
    title: 层级关系成环
    responseRequirement: 返回环路径
  - code: KERNEL-409-STATE-TRANSITION-INVALID
    httpStatus: 409
    title: 状态机不允许
    responseRequirement: 返回当前态与允许迁移集
  - code: KERNEL-410-TARGET-ARCHIVED
    httpStatus: 410
    title: 目标已废止
    responseRequirement: 提示恢复路径
  - code: KERNEL-410-TARGET-DELETED
    httpStatus: 410
    title: 目标已删除
    responseRequirement: 提示恢复路径
  - code: KERNEL-410-WORKSPACE-ARCHIVED
    httpStatus: 410
    title: 空间已归档
    responseRequirement: 提示恢复路径
  - code: KERNEL-413-BATCH-TOO-LARGE
    httpStatus: 413
    title: 批量命令超出热路径限额
    responseRequirement: 引导预览+冷路径任务
  - code: KERNEL-413-CASCADE-TOO-LARGE
    httpStatus: 413
    title: 级联操作超出热路径限额
    responseRequirement: 引导预览+冷路径任务
  - code: KERNEL-422-ENDPOINT-INVALID
    httpStatus: 422
    title: 关系端点无效或不可见
    responseRequirement: —
  - code: KERNEL-422-CARDINALITY-VIOLATION
    httpStatus: 422
    title: 关系基数超限
    responseRequirement: 返回基数定义与现值
  - code: KERNEL-422-ACTIVE-RELATIONS
    httpStatus: 422
    title: 废止或删除目标存在活动关系
    responseRequirement: 关系清单(≤50)+总数+relationPolicy 提示
  - code: KERNEL-422-DERIVED-DATA-IMPACT
    httpStatus: 422
    title: 强语义关系解除影响派生数据
    responseRequirement: 派生对象清单
  - code: KERNEL-423-TARGET-LOCKED
    httpStatus: 423
    title: 字段或对象被他人锁定
    responseRequirement: 持锁人与过期时间
  - code: KERNEL-500-TX-FAILED
    httpStatus: 500
    title: 事务执行失败(可重试)
    responseRequirement: 不暴露内部细节
  - code: PERM-403-FIELD-DENIED
    httpStatus: 403
    title: 字段级权限拒绝
    responseRequirement: —
  - code: RULE-422-*
    httpStatus: 422
    title: 规则失败或阻断
    responseRequirement: —
  - code: AI-409-CHANGESET-EXPIRED
    httpStatus: 409
    title: AI 变更集已过期
    responseRequirement: —
  - code: AI-409-CHANGESET-ALREADY-DECIDED
    httpStatus: 409
    title: AI 变更集已决策
    responseRequirement: —
  - code: AI-422-ITEM-PRECHECK-FAILED
    httpStatus: 422
    title: AI 变更项预检失败
    responseRequirement: —
  - code: KERNEL-409-TEMPLATE-VERSION-IMMUTABLE
    httpStatus: 409
    title: 已发布模板版本下定义类型
    responseRequirement: 提示改在 draft 版本操作
  - code: KERNEL-422-FIELD-CONSTRAINT-INVALID
    httpStatus: 422
    title: 属性定义约束与类型不相容
    responseRequirement: 列出违例约束项
  - code: KERNEL-422-FIELD-VALUE-INVALID
    httpStatus: 422
    title: 字段值不符合类型或约束
    responseRequirement: 逐违例字段列出
  - code: REVIEW-404-TARGET-NOT-FOUND
    httpStatus: 404
    title: 批注目标不存在或不可见
    responseRequirement: 不泄露越权目标存在性
  - code: REVIEW-422-FIELD-CODE-REQUIRED
    httpStatus: 422
    title: 字段级批注缺 fieldCode
    responseRequirement: 提示补 fieldCode
  - code: REVIEW-400-SCHEMA-INVALID
    httpStatus: 400
    title: 批注载荷不符合 Schema（如对象级传 fieldCode）
    responseRequirement: 列出违例 JSON Pointer
  - code: REVIEW-409-INVALID-STATE-TRANSITION
    httpStatus: 409
    title: 批注状态迁移非法
    responseRequirement: 返回当前态与允许迁移
  - code: SIM-404-SNAPSHOT-NOT-FOUND
    httpStatus: 404
    title: 仿真输入快照不存在
    responseRequirement: 提示先捕获快照(snapshotId)
  - code: SIM-422-ENGINE-NOT-FOUND
    httpStatus: 422
    title: 仿真引擎未注册
    responseRequirement: 列出可用 engineId
  - code: SIM-409-INVALID-STATE-TRANSITION
    httpStatus: 409
    title: 仿真运行状态迁移非法
    responseRequirement: 返回当前态与允许迁移
  - code: SIM-500-ENGINE-FAILED
    httpStatus: 500
    title: 仿真引擎执行失败
    responseRequirement: 记 failureReason，run 置 FAILED
  - code: META-422-PARENT-NOT-FOUND
    httpStatus: 422
    title: 父类型或父值类型不存在
    responseRequirement: 返回缺失的 code
  - code: META-422-PARENT-CROSS-TEMPLATE
    httpStatus: 422
    title: 父子不在同一模板版本或工作空间
    responseRequirement: —
  - code: META-422-GENERALIZATION-CYCLE
    httpStatus: 422
    title: 继承成环（对象类型或值类型）
    responseRequirement: 返回环路径
  - code: META-422-VALUETYPE-BASE-MISMATCH
    httpStatus: 422
    title: 子值类型根原语与父不一致
    responseRequirement: 返回父子根原语
  - code: META-422-REDEFINITION-INCONSISTENT
    httpStatus: 422
    title: 重定义放宽了类型或约束
    responseRequirement: 返回违例维度与父基准
  - code: META-409-PUBLISHED-IMMUTABLE
    httpStatus: 409
    title: 已发布版本下改继承/值类型/重定义
    responseRequirement: 提示改在 draft 版本操作
  - code: RULE-422-RULE-VIOLATION
    httpStatus: 422
    title: 热路径规则 BLOCK 违例
    responseRequirement: 返回命中规则 ruleCode/message/severity 清单
  - code: RULE-422-SCOPE-UNRESOLVED
    httpStatus: 422
    title: 规则 scope 引用未发布或不存在的类型/字段
    responseRequirement: 返回未解析的 objectTypeCode/fieldCode
  - code: RULE-400-DSL-SYNTAX-INVALID
    httpStatus: 400
    title: when 表达式解析失败
    responseRequirement: 返回解析错误位置
  - code: RULE-422-EVAL-LIMIT
    httpStatus: 422
    title: 规则求值超步数或关系上限
    responseRequirement: 提示降级冷路径
  - code: RULE-409-PUBLISHED-IMMUTABLE
    httpStatus: 409
    title: 已发布规则版本再 Define
    responseRequirement: 提示改在 draft 版本操作
